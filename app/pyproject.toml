[project]
name = "personal-notes-rag"
version = "0.1.0"
description = "Local, isolated personal notes with semantic retrieval and grounded RAG"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.4",
  "fastapi==0.137.0",
  "httpx==0.28.1",
  "pgvector==0.4.2",
  "psycopg[binary,pool]==3.3.3",
  "pwdlib[argon2]==0.3.0",
  "pydantic-settings==2.12.0",
  "sqlalchemy[asyncio]==2.0.46",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "coverage[toml]==7.13.4",
  "jsonschema==4.26.0",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pytest-playwright==0.7.2",
  "pyyaml==6.0.3",
  "ruff==0.15.1",
  "testcontainers[postgres]==4.14.1",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_rag"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -m 'not e2e and not live_model' --cov=notes_rag --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: OpenAPI and public contract checks",
  "integration: tests requiring real infrastructure",
  "security: authorization and sensitive-data checks",
  "e2e: browser or full-stack acceptance checks",
  "rag_eval: deterministic RAG quality evaluations",
  "live_model: tests requiring locally downloaded Ollama models",
  "performance: local performance target checks",
  "compose: host-only Docker Compose acceptance checks",
]

[tool.coverage.run]
branch = true
source = ["notes_rag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
